<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Inspection Records</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><form class="card login" method="post">
<h1>Inspection Records</h1><p class="sub">Sign in with the account created for you.</p>
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Email</label><input name="email" type="email" autocomplete="username" required autofocus>
<label style="margin-top:10px">Password</label><input name="password" type="password" autocomplete="current-password" required>
<div class="row"><button class="p" type="submit">Sign in</button></div>
<div class="msg bad">{{ err }}</div>
</form></main></body></html>
